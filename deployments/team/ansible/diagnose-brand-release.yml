- name: Read sanitized lifecycle evidence for one Harness branding release
  hosts: workstations
  gather_facts: false
  tasks:
    - name: Restrict diagnosis to the original workstation and one exact receipt
      ansible.builtin.assert:
        that:
          - inventory_hostname == 'workstation_001'
          - brand_diagnostic_receipt | default('') is match('^[0-9a-f]{32}$')
    - name: Install the bounded read-only receipt diagnosis helper
      ansible.builtin.copy:
        src: diagnose-brand-release.py
        dest: /home/ubuntu/Workspace/.ansible-ops/diagnose-harness-brand-release.py
        mode: '0700'
    - name: Read only receipt IDs and container lifecycle fields
      ansible.builtin.command:
        argv: [/usr/bin/python3, /home/ubuntu/Workspace/.ansible-ops/diagnose-harness-brand-release.py]
        stdin: "{{ {'receiptId': brand_diagnostic_receipt} | to_json }}"
      register: brand_diagnosis
      changed_when: false
      no_log: true
    - name: Save sanitized lifecycle metadata on the controller
      ansible.builtin.copy:
        content: |
          {{ brand_diagnosis.stdout }}
        dest: '{{ playbook_dir }}/../reports/harness-brand-diagnosis.json'
        mode: '0600'
      delegate_to: localhost
      become: false
    - name: Show only sanitized lifecycle metadata
      ansible.builtin.debug:
        msg: '{{ brand_diagnosis.stdout | from_json }}'
